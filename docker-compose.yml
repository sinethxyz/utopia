services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: utopia
      POSTGRES_PASSWORD: utopia
      POSTGRES_DB: utopia
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U utopia"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
