name: CI

on:
  push:
    branches:
      - main
      - "cleanup/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: utopia
          POSTGRES_PASSWORD: utopia
          POSTGRES_DB: utopia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U utopia -d utopia_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+asyncpg://utopia:utopia@localhost:5432/utopia_test
      DATABASE_URL_SYNC: postgresql+psycopg://utopia:utopia@localhost:5432/utopia_test
      ANTHROPIC_API_KEY: test
      OPENAI_API_KEY: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Compile
        run: python -m compileall -q src tests migrations

      - name: Apply migrations
        run: alembic upgrade head

      - name: Test
        run: pytest -q
